<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะการแจ้งเรื่อง | บ้านหนองหม้อ</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-light: #e8f5e9;
            --primary-dark: #1b5e20;
            --bg-color: #f4f8f4;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 16px;
            --box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Navbar Navigation */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .nav-brand {
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .nav-btn.outline {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px 20px;
            box-shadow: var(--box-shadow);
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: var(--primary-dark);
            font-size: 20px;
            margin-top: 10px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            text-transform: uppercase;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-search {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Result Display */
        .result-container {
            display: none;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        .info-group {
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-label {
            color: #777;
            font-size: 13px;
        }

        .info-value {
            font-weight: 500;
            color: var(--text-color);
            margin-top: 2px;
        }

        .report-img {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-brand">
                <span>🏡</span> บ้านหนองหม้อ
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn outline"><i class="fa-solid fa-pen-to-square"></i> แจ้งเรื่อง</a>
                <a href="track.html" class="nav-btn active"><i class="fa-solid fa-magnifying-glass"></i> ติดตามสถานะ</a>
            </div>
        </div>

        <!-- Search Card -->
        <div class="card">
            <div class="header">
                <div style="font-size: 40px;">🔍</div>
                <h2>ติดตามสถานะการแจ้งเรื่อง</h2>
                <p style="font-size: 13px; color: #666;">ระบุรหัสเรื่องที่ได้รับเพื่อตรวจสอบสถานะ</p>
            </div>

            <div class="search-box">
                <input type="text" id="ticketInput" class="search-input" placeholder="เช่น NM-20260810-XXXX">
                <button class="btn-search" onclick="searchTicket()"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา</button>
            </div>
        </div>

        <!-- Result Card -->
        <div class="card result-container" id="resultCard">
            <div style="text-align: center;">
                <span class="status-badge" id="resStatus">🟡 รอตรวจสอบ</span>
            </div>

            <div class="info-group">
                <div class="info-label">เลขที่เรื่อง:</div>
                <div class="info-value" id="resTicketNo">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">หัวข้อเรื่อง:</div>
                <div class="info-value" id="resTopic">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">ประเภท:</div>
                <div class="info-value" id="resCategory">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">สถานที่เกิดเหตุ:</div>
                <div class="info-value" id="resLocation">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">รายละเอียด:</div>
                <div class="info-value" id="resDetail">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">หน่วยงานรับผิดชอบ:</div>
                <div class="info-value" id="resDept" style="color: var(--primary-color); font-weight: 600;">-</div>
            </div>

            <div id="imgContainer"></div>
        </div>

    </div>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB8ARiPkKyZvaeMVuNJn5XVIKlUBXnyGFM",
            authDomain: "compiant-village.firebaseapp.com",
            projectId: "compiant-village",
            storageBucket: "compiant-village.firebasestorage.app",
            messagingSenderId: "715311562609",
            appId: "1:715311562609:web:bd72d9e19509dce234c0d0",
            measurementId: "G-GPYMB1K4XE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Auto Search from URL Param (ถ้ามาจากหน้าแจ้งเรื่องสำเร็จ)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ticket = urlParams.get('ticket');
            if (ticket) {
                document.getElementById('ticketInput').value = ticket;
                searchTicket();
            }
        });

        window.searchTicket = async function() {
            const ticketNo = document.getElementById('ticketInput').value.trim();
            if (!ticketNo) {
                alert('กรุณากรอกรหัสติดตามเรื่อง');
                return;
            }

            const resultCard = document.getElementById('resultCard');
            resultCard.style.display = 'none';

            try {
                const q = query(collection(db, "reports"), where("ticketNo", "==", ticketNo));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert('ไม่พบข้อมูลรหัสเรื่องนี้ในระบบ กรุณาตรวจสอบรหัสอีกครั้ง');
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    document.getElementById('resStatus').innerText = data.status || '🟡 รอตรวจสอบ';
                    document.getElementById('resTicketNo').innerText = data.ticketNo;
                    document.getElementById('resTopic').innerText = data.topic;
                    document.getElementById('resCategory').innerText = data.category || 'ทั่วไป';
                    document.getElementById('resLocation').innerText = data.location;
                    document.getElementById('resDetail').innerText = data.detail || 'ไม่มีรายละเอียดเพิ่มเติม';
                    document.getElementById('resDept').innerText = data.assignedDepartment || 'ยังไม่ได้มอบหมาย';

                    const imgContainer = document.getElementById('imgContainer');
                    if (data.imageUrl) {
                        imgContainer.innerHTML = `<div class="info-label" style="margin-top:10px;">รูปภาพแนบ:</div><img src="${data.imageUrl}" class="report-img">`;
                    } else {
                        imgContainer.innerHTML = '';
                    }

                    resultCard.style.display = 'block';
                });

            } catch (err) {
                alert('เกิดข้อผิดพลาดในการค้นหา: ' + err.message);
            }
        };
    </script>
</body>
</html>
